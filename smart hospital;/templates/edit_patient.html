{% extends "base.html" %}
{% block title %}Edit patient{% endblock %}
{% block page_heading %}Edit patient{% endblock %}
{% block content %}
<div class="section-intro"><div><h1>Edit patient record</h1><p>Update the selected demo patient record.</p></div><a href="{{ url_for('patients') }}" class="btn btn-light">← Back to patients</a></div>
<div class="panel-card narrow-panel"><form method="post" class="row g-3">
<div class="col-12"><label class="form-label">Patient ID</label><input class="form-control" value="{{ patient.patient_code }}" disabled></div>
<div class="col-12"><label class="form-label">Full name *</label><input class="form-control" name="full_name" value="{{ patient.full_name }}" required></div>
<div class="col-md-4"><label class="form-label">Age *</label><input class="form-control" type="number" name="age" min="0" max="120" value="{{ patient.age }}" required></div>
<div class="col-md-8"><label class="form-label">Gender *</label><select class="form-select" name="gender" required>{% for g in ['Female','Male','Other'] %}<option {% if patient.gender == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ patient.phone }}"></div>
<div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3">{{ patient.notes }}</textarea></div>
<div class="col-12"><button class="btn btn-primary">Save changes</button></div>
</form></div>
{% endblock %}
