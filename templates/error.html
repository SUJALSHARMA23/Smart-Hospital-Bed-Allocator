{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block page_heading %}Something went wrong{% endblock %}
{% block content %}
<div class="panel-card error-card"><div class="error-code">{{ code }}</div><h1>We couldn't open that page</h1><p>{{ message }}</p><a class="btn btn-primary mt-3" href="{{ url_for('dashboard') }}">Return to dashboard</a></div>
{% endblock %}
